{% extends "layout.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="/static/css/pretendard.css">
<link rel="stylesheet" href="/static/css/board/board.css">
{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="mb-3">
        <a href="/board/{{ board.code }}" class="btn btn-outline-secondary btn-sm px-3 rounded-pill">
            <i class="bi bi-arrow-left me-1"></i> 목록으로
        </a>
    </div>

    <div class="card shadow-sm border-secondary-subtle mt-4">
        <div class="card-body text-center py-5">
            <i class="bi bi-lock-fill text-warning" style="font-size: 4rem;"></i>
            <h4 class="mt-3 fw-bold">비밀글입니다</h4>
            <p class="text-muted">
                이 게시글은 작성자와 관리자만 볼 수 있습니다.<br>
                게시글 작성 시 입력한 비밀번호를 입력해주세요.
            </p>
            
            <div class="d-flex justify-content-center mt-4">
                <input type="password" id="accessPassword" class="form-control" style="max-width: 250px;" placeholder="비밀번호 입력" autofocus>
                <button class="btn btn-primary ms-2 px-4 fw-bold" id="btnCheck">확인</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/board/board_secret.js"></script>
{% endblock %}
