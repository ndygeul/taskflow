{% extends "layout.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="/static/css/pretendard.css">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/monitoring/monitoring_terminal.css">
{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0"><i class="bi bi-terminal-fill me-2"></i>SYS/TM 통합 관제 시스템</h4>
    </div>

    <div class="d-flex w-100" style="gap: 20px;">
        
        <div class="noc-terminal-wrapper w-50" id="sys-terminal-wrapper">
            <div class="term-header">
                <div class="term-title-sys">SYS 관제 터미널</div>
                <div class="term-summary" id="sys-term-summary">
                    [SYS] 대상 서버와 통신을 준비 중입니다<span class="blink-cursor">_</span>
                </div>
            </div>
            <div id="sys-log-output">
                <div style="color: #555;">Initializing SYS sequence...</div>
            </div>
        </div>

        <div class="noc-terminal-wrapper w-50" id="tm-terminal-wrapper">
            <div class="term-header">
                <div class="term-title-tm">TM 관제 터미널</div>
                <div class="term-summary" id="tm-term-summary">
                    [TM] 대상 서버와 통신을 준비 중입니다<span class="blink-cursor">_</span>
                </div>
            </div>
            <div id="tm-log-output">
                <div style="color: #555;">Initializing TM sequence...</div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/monitoring/terminal_core.js"></script>
{% endblock %}
