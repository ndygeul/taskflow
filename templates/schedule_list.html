{% extends "layout.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="/static/css/pretendard.css">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/schedule/schedule_list.css">
{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold"><i class="bi bi-calendar-check me-2"></i>근무표 조회</h4>
        <div class="d-flex gap-2">
            <input type="month" id="monthSelector" class="form-control w-auto">
            <button class="btn btn-success" onclick="document.getElementById('excelFile').click()">
                <i class="bi bi-file-earmark-excel me-1"></i>엑셀 업로드
            </button>
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-sm table-schedule mb-0" id="scheduleTable">
                    </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/schedule/schedule_list.js"></script>
{% endblock %}
